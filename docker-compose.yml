services:
  postgres:
    image: postgis/postgis:16-3.4
    # The upstream PostGIS image is amd64-only; Docker emulates it on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gossip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gossip}
      POSTGRES_DB: ${POSTGRES_DB:-gossip}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
